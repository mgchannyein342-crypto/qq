<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <style>
    body{
        height: 2000px;
    }
    .container{
        width: 40%;
        background-color: aqua;
        aspect-ratio: 1/1;
        margin-top: 200px;
        position: relative;
        border-radius: 50%;
        overflow:hidden;
        border: 10px violet dashed;
    }
    .box{
        background-color: blue;
        width: 100px;
        height: 200px;
        position: absolute;
        top: 10%;
        left: 20%;

    }
  </style>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
